version: "2"

run:
  # Lint the go-fuzz harness too, which only builds with the gofuzz tag.
  build-tags:
    - gofuzz

linters:
  enable:
    - gocritic
    - unconvert
  settings:
    gocritic:
      disabled-checks:
        - ifElseChain
        - elseif
  # The exclusions golangci-lint v1 applied by default.
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

formatters:
  enable:
    - gofmt
